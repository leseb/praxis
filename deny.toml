[advisories]
unmaintained = "all"
maximum-db-staleness = "P30D"
ignore = [
    # derivative 2.2.0: unmaintained (pingora transitive)
    "RUSTSEC-2024-0388",
    # rustls-pemfile 2.2.0: unmaintained (transitive via pingora fork)
    "RUSTSEC-2025-0134",
    # NOTE: the unsound `lru` advisory RUSTSEC-2026-0253 is not listed
    # here: `unmaintained = "all"` does not gate `unsound` advisories,
    # so cargo-deny never flags it and an ignore would be unused. It is
    # ignored in .cargo/audit.toml, where cargo-audit does warn on it.
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

# Suppress known-unfixable duplicate version warnings.
# All are transitive: Praxis uses the latest version of
# each direct dependency. Re-evaluate on each Pingora
# fork sync.
skip = [
    # rand 0.9 is pinned by metrics-util, opentelemetry_sdk, and
    # proptest (tests); all lag behind our rand 0.10.
    # thiserror 1 (via the x509-parser stack) is covered by the
    # Pingora fork skip-tree below, not listed here.
    { crate = "rand@0.9", reason = "metrics-util + opentelemetry_sdk + proptest" },
]

# Pingora fork pulls many older deps; suppress the
# entire subtree rather than listing each one.
skip-tree = [
    { crate = "quixotic-plecostomus-core@0.8", reason = "pingora fork subtree: older dashmap/rand/syn/indexmap/hashbrown plus the x509-parser -> thiserror 1 duplicate" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
