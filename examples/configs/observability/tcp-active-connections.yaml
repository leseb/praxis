# TCP Active Connections
#
# Prometheus gauge for TCP connections currently open per listener.
# Incremented on accept and decremented when the session ends, including
# early closes such as connect failures. Scraped via the admin /metrics
# endpoint.
#
# Usage:
#   cargo run -p praxis-proxy -- -c examples/configs/observability/tcp-active-connections.yaml
#
# Exercise:
#   echo "hi" | nc localhost 5432
#   curl -s http://localhost:9901/metrics | grep tcp_active_connections

admin:
  address: "127.0.0.1:9901"

insecure_options:
  allow_private_upstreams: true

listeners:
  - name: postgres
    address: "127.0.0.1:5432"
    protocol: tcp
    upstream: "127.0.0.1:15432"
